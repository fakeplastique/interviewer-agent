# Test cases for Buddy positive reactions (score > 5).
- description: strong GIL answer
  vars:
    lang: ua
    question: "What is the Global Interpreter Lock in Python?"
    answer: >-
      The GIL is a mutex in CPython that lets only one thread execute Python
      bytecode at a time. It simplifies memory management but limits CPU-bound
      multithreading, which is why multiprocessing or C extensions are used
      for parallelism.
    score: 9
    feedback: "Accurate and complete, mentions practical workarounds."

- description: solid indexing answer
  vars:
    lang: ua
    question: "How do database indexes speed up queries?"
    answer: >-
      An index is a sorted structure, usually a B-tree, that lets the database
      find rows without scanning the whole table, trading extra writes and
      storage for faster reads.
    score: 8
    feedback: "Good grasp of the trade-offs."

