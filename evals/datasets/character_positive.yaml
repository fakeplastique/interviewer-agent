    question: "What makes an API RESTful?"
    answer: >-
      Statelessness, resources identified by URLs, and standard HTTP methods
      like GET and POST used according to their semantics.
    score: 6
    feedback: "Correct fundamentals, could mention representations and HATEOAS."

