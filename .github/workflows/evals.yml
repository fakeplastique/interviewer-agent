name: LLM Evals

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/app/prompts/**"
      - "backend/app/services/llm.py"
      - "backend/app/agent/nodes.py"
      - "backend/tests/evals/**"
      - "evals/**"
      - ".github/workflows/evals.yml"

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Structured-output regression evals
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pytest tests/evals -m eval -v

  promptfoo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend deps (prompt registry is imported by evals/prompts.py)
        run: pip install -r backend/requirements.txt
      - name: Run promptfoo eval suites
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          for config in evals/*.config.yaml; do
            echo "── $config ──"
            npx promptfoo@latest eval -c "$config" --no-progress-bar \
              -o "promptfoo-results/$(basename "$config" .config.yaml).json"
          done
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-results
          path: promptfoo-results/
